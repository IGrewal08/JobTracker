services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      HOST: redis
      HOST_URL: ${HOST_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '3000:3000'
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: production
    command: node dist/queues/scrape.worker.js
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      HOST: redis
      HOST_URL: ${HOST_URL}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    environment:
      - PORT=3000
      - HOST=0.0.0.0
    depends_on:
      - api
  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
    volumes:
      - ./client/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - client
      - api

volumes:
  postgres_data:
  redis_data:
